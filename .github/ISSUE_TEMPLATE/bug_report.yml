name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Please don't paste API keys, tokens, real names, client details, emails or phone numbers.** Replace them with placeholders like `<token>` or `Examplebrand Studio`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: I pressed Run now on the morning brief in Studio and it said the brief was unavailable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a fresh `./aos doctor` if you can, and include anything relevant from `./aos logs`.
      placeholder: |
        1. Run `./aos doctor` (all checks pass)
        2. In Studio, open …
        3. …
        4. `./aos logs` shows …
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./aos doctor`
      description: Run it from your AttentionOS folder and paste the result. It never prints secret values.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen
      options:
        - Studio
        - Claude Code
        - Telegram or Discord
        - CLI (`./aos`)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AttentionOS version
      description: "`./aos status` shows it, as does Studio's settings page."
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL 2)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. `./aos logs` follows the app's logs (Ctrl-C to stop). Check them for personal data before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal or client data from this report.
          required: true
