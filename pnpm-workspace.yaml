packages:
  - "apps/*"
  - "packages/*"
  - "packages/providers/*"
  - "modules/*"
allowBuilds:
  esbuild: true
# tsup's declaration bundler requires the JavaScript compiler API removed in TS 7.
# Keep the workspace compiler on TS 7 and isolate the compatibility version to tsup.
packageExtensions:
  tsup@8.5.1:
    dependencies:
      typescript: 5.9.3
